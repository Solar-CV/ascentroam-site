<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ar-theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}

        // Precedence: explicit user choice > Cloudflare country hint > browser.
        var saved = null;
        try {
          saved = localStorage.getItem('ar-lang');
        } catch (e) {}
        var lang = saved === 'zh' || saved === 'en' ? saved : window.__AR_LANG__;
        if (lang !== 'zh' && lang !== 'en') {
          lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      })();
    </script>
    <title>Support — AscentRoam</title>
    <meta name="description" content="AscentRoam is free, with no ads and no paid unlocks. Any support is voluntary and buys nothing back — the app is the same for everyone. Afdian and Ko-fi links inside." />
    <meta name="theme-color" content="#f7f7f4" />
    <script>
      try {
        if (document.documentElement.dataset.theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e100f');
        }
      } catch (e) {}
    </script>
    <meta property="og:title" content="Support — AscentRoam" />
    <meta property="og:description" content="AscentRoam is free and stays free. Supporting it is voluntary and buys nothing back. Afdian and Ko-fi links inside." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/img/everest-center.jpg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body id="top">
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:12vh auto;padding:0 24px;font:16px/1.7 Georgia,serif;color:#1a1c1a">

        <p>AscentRoam 免费、无广告、无付费解锁。赞助是自愿的赠与，不换取任何东西——所有课程、题目和徽章对每个人一样，与有没有赞助无关。</p>

      </div>

    <script type="module" src="/src/support-main.jsx"></script>
  </body>
</html>
