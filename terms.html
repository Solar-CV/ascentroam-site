<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ar-theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}

        // Precedence: explicit user choice > Cloudflare country hint > browser.
        var saved = null;
        try {
          saved = localStorage.getItem('ar-lang');
        } catch (e) {}
        var lang = saved === 'zh' || saved === 'en' ? saved : window.__AR_LANG__;
        if (lang !== 'zh' && lang !== 'en') {
          lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      })();
    </script>
    <title>Terms of service — AscentRoam</title>
    <meta name="description" content="AscentRoam is free for personal use. These terms cover the licence, where the content stops, accounts and data, intellectual property, liability, and how changes are announced." />
    <meta name="theme-color" content="#f7f7f4" />
    <script>
      try {
        if (document.documentElement.dataset.theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e100f');
        }
      } catch (e) {}
    </script>
    <meta property="og:title" content="Terms of service — AscentRoam" />
    <meta property="og:description" content="The licence, the limits of the content, and the liability terms for AscentRoam — in six short sections." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/img/everest-center.jpg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body id="top">
    <div id="root"></div>

</html>
